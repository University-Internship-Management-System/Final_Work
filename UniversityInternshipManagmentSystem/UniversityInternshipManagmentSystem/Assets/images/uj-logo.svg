<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ujGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006633" />
      <stop offset="100%" stop-color="#004d26" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5a93b" />
      <stop offset="100%" stop-color="#c59b27" />
    </linearGradient>
  </defs>
  <!-- Outer Shield -->
  <path d="M 50,5 C 75,5 92,12 92,35 C 92,68 50,95 50,95 C 50,95 8,68 8,35 C 8,12 25,5 50,5 Z" fill="url(#ujGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  <!-- Inner Border -->
  <path d="M 50,11 C 70,11 85,17 85,36 C 85,63 50,87 50,87 C 50,87 15,63 15,36 C 15,17 30,11 50,11 Z" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="2,2" />
  
  <!-- Crown Element (Jordanian Royal Crown Symbolism) -->
  <path d="M 36,25 L 42,32 L 50,22 L 58,32 L 64,25 L 62,36 L 38,36 Z" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="0.5" />
  <circle cx="36" cy="24" r="1.5" fill="#ffffff" />
  <circle cx="50" cy="21" r="1.8" fill="#ffffff" />
  <circle cx="64" cy="24" r="1.5" fill="#ffffff" />

  <!-- Open Book (Knowledge / University) -->
  <path d="M 50,52 C 45,46 32,46 26,49 L 26,67 C 32,64 45,64 50,69 C 55,64 68,64 74,67 L 74,49 C 68,46 55,46 50,52 Z" fill="#ffffff" />
  <line x1="50" y1="52" x2="50" y2="69" stroke="#006633" stroke-width="1.5" />

  <!-- Circuit Lines for KASIT IT Faculty -->
  <circle cx="33" cy="56" r="1.5" fill="url(#goldGrad)" />
  <circle cx="67" cy="56" r="1.5" fill="url(#goldGrad)" />
  <path d="M 33,56 L 40,56 M 67,56 L 60,56" stroke="url(#goldGrad)" stroke-width="1" />

  <!-- Year 1962 (University of Jordan Founding Year) -->
  <text x="50" y="80" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6.5" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">1962 - UJ</text>
</svg>
