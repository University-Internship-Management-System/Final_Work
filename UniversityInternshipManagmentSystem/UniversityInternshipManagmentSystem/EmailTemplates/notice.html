<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light only">
<title>UIMS</title>
<!--
  UIMS - one layout for all notification emails (welcome, password changed, task, certificate).
  Config/EmailSender.cs fills in the words in double curly braces. The part marked as the note is removed when there is no note.
  Everything is inline CSS and tables, because email programs ignore normal stylesheets.
-->
</head>
<body style="margin:0;padding:0;background:#F8FAF9;-webkit-text-size-adjust:100%;">

<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#F8FAF9;font-size:1px;line-height:1px;">{{TITLE}}</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F8FAF9;">
  <tr>
    <td align="center" style="padding:32px 16px;">

      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#FFFFFF;border:1px solid #E2E8E5;border-radius:16px;overflow:hidden;font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#183B31;">

        <!-- header -->
        <tr>
          <td align="center" bgcolor="#07523E" style="background:#07523E;padding:30px 24px 26px;">
            <div style="font-size:30px;line-height:34px;font-weight:800;letter-spacing:4px;color:#FFFFFF;">UIMS</div>
            <div style="margin-top:6px;font-size:13px;line-height:18px;color:#CFE8DE;">University Internship Management System</div>
          </td>
        </tr>
        <tr><td height="4" bgcolor="#178568" style="background:#178568;font-size:0;line-height:0;">&nbsp;</td></tr>

        <!-- title -->
        <tr>
          <td style="padding:38px 40px 6px;">
            <span style="display:inline-block;background:#EAF4EF;color:#07523E;border-radius:99px;padding:5px 14px;font-size:12px;line-height:16px;font-weight:700;letter-spacing:1.2px;">{{TAG}}</span>
            <h1 style="margin:18px 0 12px;font-size:28px;line-height:34px;font-weight:800;color:#04382D;">{{TITLE}}</h1>
            <p style="margin:0 0 8px;font-size:16px;line-height:26px;color:#183B31;">Hello {{NAME}},</p>
            <p style="margin:0;font-size:16px;line-height:26px;color:#183B31;">{{MESSAGE}}</p>
          </td>
        </tr>

        <!--NOTE-->
        <tr>
          <td style="padding:22px 40px 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#EAF4EF;border-radius:12px;">
              <tr>
                <td style="padding:16px 20px;">
                  <div style="font-size:12px;line-height:16px;font-weight:700;letter-spacing:1px;color:#178568;">{{NOTE_LABEL}}</div>
                  <div style="margin-top:6px;font-size:15px;line-height:23px;color:#04382D;">{{NOTE}}</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <!--/NOTE-->

        <!-- button -->
        <tr>
          <td align="center" style="padding:30px 40px 34px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" bgcolor="#07523E" style="background:#07523E;border-radius:10px;">
                  <a href="{{BUTTON_URL}}" target="_blank" style="display:inline-block;padding:16px 38px;font-family:Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:20px;font-weight:700;color:#FFFFFF;text-decoration:none;border-radius:10px;">{{BUTTON_TEXT}}</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- footer -->
        <tr>
          <td align="center" bgcolor="#F8FAF9" style="background:#F8FAF9;border-top:1px solid #E2E8E5;padding:22px 32px;">
            <div style="font-size:13px;line-height:20px;font-weight:600;color:#183B31;">The University of Jordan</div>
            <div style="font-size:12px;line-height:19px;color:#65756E;">King Abdullah II School of Information Technology (KASIT)</div>
            <div style="margin-top:10px;font-size:11px;line-height:17px;color:#8A9A93;">This is an automatic message. Please do not reply to it.</div>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>
</body>
</html>
